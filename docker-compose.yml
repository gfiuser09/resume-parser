services:
  resume-parser:
    build: .
    image: resume-parser:latest
    container_name: resume-parser
    ports:
      # Override the host port when 5000 is already in use:
      #   HOST_PORT=8080 docker compose up
      - "${HOST_PORT:-5000}:5000"
    environment:
      MAX_FILE_SIZE_BYTES: "10485760"   # 10 MB
      EXTRACTION_ENGINE: "rule-based"
      OCR_LANG: "eng"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    # Uploads are written to /tmp and deleted after each request, so the
    # filesystem can stay read-only apart from that.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
